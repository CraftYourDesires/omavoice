# Use the ONNX builds (Cohere engine; CUDA needs the cudnn package) without touching the
# root-owned /usr/bin/voxtype symlink. Waits for Ollama so the first cleanup is warm.
[Unit]
Wants=ollama.service
After=ollama.service

[Service]
# GPU build by default. dictation-vram-guard writes %t/voxtype-variant.env
# (VOXTYPE_BIN=.../voxtype-onnx-avx2) and restarts this service to move
# transcription to the CPU while other apps need the VRAM, then removes it.
# The installer writes ~/.config/voxtype/omavoice.env on machines without an
# NVIDIA GPU (VOXTYPE_BIN=.../voxtype-onnx-avx2 or -avx512). Later files win.
Environment=VOXTYPE_BIN=/usr/lib/voxtype/voxtype-onnx-cuda
EnvironmentFile=-%h/.config/voxtype/omavoice.env
EnvironmentFile=-%t/voxtype-variant.env
ExecStart=
ExecStart=/bin/sh -c 'exec "$VOXTYPE_BIN" -q daemon'
# dictation-live follows "Chunk N completed" debug lines to clean long
# dictations while you talk. RUST_LOG overrides -q. The log holds transcripts,
# so it goes to RAM (%t = $XDG_RUNTIME_DIR) instead of the on-disk journal, and
# dictation-live truncates it at every recording start.
Environment=RUST_LOG=voxtype=warn,voxtype::daemon=debug
StandardOutput=append:%t/voxtype-daemon.log
